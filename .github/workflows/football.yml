name: Football Intelligence V4

on:
  schedule:
    - cron: "30 8 * * 1"
    - cron: "30 12 * * 1"
    - cron: "30 8 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "review | midweek | weekend | download-only"
        required: true
        default: "download-only"

permissions:
  contents: write

concurrency:
  group: football-v4
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick the mode
        id: mode
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            schedule:"30 8 * * 1")  echo "mode=review"  >> $GITHUB_OUTPUT ;;
            schedule:"30 12 * * 1") echo "mode=midweek" >> $GITHUB_OUTPUT ;;
            schedule:"30 8 * * 4")  echo "mode=weekend" >> $GITHUB_OUTPUT ;;
            *) echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Fetch the current database (branch data, else the seed)
        run: |
          if git ls-remote --exit-code --heads origin data; then
            git fetch --depth 1 origin data
            git show origin/data:football.db > football.db
          else
            cp seed/football.db football.db
          fi
          ls -la football.db

      - name: Pull fixtures and results from API-Football
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python download.py --results

      - name: Run the V4 model
        if: steps.mode.outputs.mode != 'download-only'
        run: python run_v4.py ${{ steps.mode.outputs.mode }}

      - name: Slim the database
        run: python export_slim.py football.db football_slim.db

      - name: Commit reports and logs to main
        run: |
          git config user.name "football-v4-bot"
          git config user.email "football-v4-bot@users.noreply.github.com"
          git add -A reports data logs runs predictions_log.csv
          git commit -m "V4 ${{ steps.mode.outputs.mode }} run $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "nothing to commit"
          git push

      - name: Push the slim database to branch data (single commit, replaced each run)
        run: |
          mkdir -p /tmp/data && cd /tmp/data
          git init -q -b data
          git config user.name "football-v4-bot"
          git config user.email "football-v4-bot@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/football_slim.db" football.db
          echo "Slim football.db written $(date -u +'%Y-%m-%d %H:%M') UTC by the ${{ steps.mode.outputs.mode }} run." > README.md
          git add football.db README.md
          git commit -q -m "football.db $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
