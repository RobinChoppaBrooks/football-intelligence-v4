name: Football Intelligence V4

# This file is deliberately tiny and should not need editing again: all the logic lives in ci/run.sh, which is an ordinary
# file in the repository. Only the cron lines live here because GitHub requires them to. Each London slot has a GMT entry
# and a BST entry; ci/run.sh runs the one that matches today's London clock and skips the other.
#   Monday 08:30 London  review     Monday 12:30 London  midweek     Friday 07:00 London  weekend

on:
  schedule:
    - cron: "30 8 * * 1"
    - cron: "30 7 * * 1"
    - cron: "30 12 * * 1"
    - cron: "30 11 * * 1"
    - cron: "0 7 * * 5"
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "review | midweek | weekend | download-only"
        required: true
        default: "download-only"

permissions:
  contents: write

concurrency:
  group: football-v4
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the pipeline (ci/run.sh)
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_SCHEDULE: ${{ github.event.schedule }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/run.sh
